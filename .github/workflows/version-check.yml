name: Version Check

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine plugin bundle
        id: get_plugin
        run: |
          PLUGIN_BUNDLE_PATH=$(find . -maxdepth 1 -iname "*.indigoPlugin" -type d | head -1)
          if [ -z "$PLUGIN_BUNDLE_PATH" ]; then
            echo "Error: No .indigoPlugin directory found in repository root." >&2
            exit 1
          fi
          PLUGIN_BUNDLE=$(basename "$PLUGIN_BUNDLE_PATH")
          echo "plugin_bundle=$PLUGIN_BUNDLE" >> $GITHUB_OUTPUT
          echo "Detected plugin bundle: $PLUGIN_BUNDLE"

      - name: Extract version from Info.plist
        id: get_version
        run: |
          PLUGIN_BUNDLE="${{ steps.get_plugin.outputs.plugin_bundle }}"
          VERSION=$(grep -A1 '<key>PluginVersion</key>' "${PLUGIN_BUNDLE}/Contents/Info.plist" | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not extract PluginVersion from Info.plist." >&2
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Check if tag already exists
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Version v$VERSION already exists as a git tag. Please update the PluginVersion in Info.plist."
            exit 1
          fi
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error::Version $VERSION already exists as a git tag. Please update the PluginVersion in Info.plist."
            exit 1
          fi
          echo "✓ Version $VERSION is new and can be released."

      - name: Check CFBundleVersion fits the Plugin Store
        run: |
          PLIST=$(find . -maxdepth 3 -ipath "*.indigoplugin/Contents/Info.plist" | head -1)
          if [ -z "$PLIST" ]; then
            echo "::error::No .indigoPlugin/Contents/Info.plist found." >&2
            exit 1
          fi
          BUNDLE_VERSION=$(grep -A1 '<key>CFBundleVersion</key>' "$PLIST" | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          if [ -z "$BUNDLE_VERSION" ]; then
            echo "::error::Could not read CFBundleVersion from $PLIST." >&2
            exit 1
          fi
          echo "CFBundleVersion: $BUNDLE_VERSION (${#BUNDLE_VERSION} characters)"
          if [ ${#BUNDLE_VERSION} -gt 8 ]; then
            echo "::error::CFBundleVersion '$BUNDLE_VERSION' is ${#BUNDLE_VERSION} characters. The Indigo Plugin Store stores it in a varchar(8) column, so anything longer fails ingestion with \"1406 (22001): Data too long for column 'bundleVersion'\" and the store silently stops picking up releases. CFBundleVersion is the bundle-layout version, not the release version (that is PluginVersion) — use a short static value such as 1.0.0."
            exit 1
          fi
          echo "CFBundleVersion fits the store's 8-character column."
